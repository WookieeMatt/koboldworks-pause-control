# Release by pushing a tag equal to the version, e.g.:
#   git tag 1.4.0 && git push origin 1.4.0
# (Publishing a GitHub release with that tag from the website also works.)
# This stamps the version into module.json, zips the module, and attaches
# module.json + module.zip to the release so the manifest URL always points at the latest.
name: Release

on:
  push:
    tags: ['*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into manifest
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG#v}"
          jq --arg v "$VERSION" \
             --arg dl "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .download = $dl' module.json > module.tmp.json
          mv module.tmp.json module.json
          cat module.json

      - name: Package module
        run: zip -r module.zip module.json src lang README.md CHANGELOG.md LICENSE

      - name: Create release and attach files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Release notes = this version's section of the changelog
          awk -v v="## ${TAG#v}" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" module.json module.zip --clobber
          else
            gh release create "$TAG" module.json module.zip --title "$TAG" --notes-file notes.md --latest
          fi
