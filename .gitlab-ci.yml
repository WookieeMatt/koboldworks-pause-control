# You can override the included template(s) by including variable overrides
# See https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables
stages:
  - test
  - release

variables:
  GIT_STRATEGY: fetch

include:
  - template: Security/SAST.gitlab-ci.yml

eslint:
  stage: test
  image: node
  interruptible: true
  rules:
  - allow_failure: false
  - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG == ""'
  script:
  - npm install
  - npx eslint .

tag-latest:
  stage: release
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TAG && $CI_COMMIT_TAG !~ "latest"'
  before_script:
    - export TAG_ABBREV=`git describe --tags --abbrev=0`
  script:
    - git remote show origin
    - git remote add origin git@gitlab.com:$CI_PROJECT_PATH.git
    - git config user.name "$GITLAB_USER_NAME"
    - git config user.email "$GITLAB_USER_EMAIL"
    - git tag latest -fa "latest" -m "$TAG_ABBREV"
    - git push origin --tags
